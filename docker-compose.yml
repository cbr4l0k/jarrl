services:
  api:
    build: .
    restart: unless-stopped
    command: ["uvicorn", "jarrl.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8856:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/jarrl.sqlite}
      FEED_BASE_URL: ${FEED_BASE_URL:-http://localhost:8856/rss}
    volumes:
      - jarrl-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/rss')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  bot:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "jarrl.bot"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ALLOWED_TELEGRAM_USER_ID: ${ALLOWED_TELEGRAM_USER_ID}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/jarrl.sqlite}
      FEED_BASE_URL: ${FEED_BASE_URL:-http://localhost:8856/rss}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - jarrl-data:/app/data

volumes:
  jarrl-data:
